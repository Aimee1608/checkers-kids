name: CheckersKids
options:
  bundleIdPrefix: com.aimee
  deploymentTarget:
    iOS: "16.0"
targets:
  CheckersKids:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aimee.checkerskids
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: "3LM3J9NPCR"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "跳跳棋"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        # iPad 分屏/多任务强制要求声明全部 4 个方向,不声明的话 App Store 上传直接被拒
        # ("No orientations were specified")。GENERATE_INFOPLIST_FILE 的自动生成机制不认
        # "KEY~ipad" 这种带 idiom 后缀的自定义写法(试过,编译出来的 Info.plist 里这个 key
        # 直接不存在),所以 iPhone/iPad 不区分,统一开 4 个方向,不用跟这个工具限制较劲。
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      configs:
        # 自动签名(CODE_SIGN_STYLE=Automatic)下 CODE_SIGN_IDENTITY 只能是
        # "Apple Development",不能手动指定成 Apple Distribution——那是
        # -exportArchive 导出那一步才切换的身份,archive 这步本身固定用开发身份编译,
        # 手动指定发行身份反而会报 "conflicting provisioning settings"。
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"
  CheckersKidsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: CheckersKids
schemes:
  CheckersKids:
    build:
      targets:
        CheckersKids: all
        CheckersKidsUITests: [test]
    test:
      targets:
        - CheckersKidsUITests
